[package]
name = "mini-todo"
version = "1.3.0"
description = "迷你待办 —— 基于 Tauri 的看板式待办管理工具"
edition = "2021"
rust-version = "1.77.2"
license = "GPL-3.0-or-later"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "=2.11.0", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-notification = { version = "2", features = ["windows7-compat"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
chrono = "0.4"
rand = "0.8"
parking_lot = "0.12"

[target.'cfg(windows)'.dependencies]
webview2-com = "=0.38.2"
windows = "=0.61.3"
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_System_Threading",
  "Win32_System_ProcessStatus",
  "Win32_System_Diagnostics_ToolHelp",
] }

[features]
# 生产/打包构建用：让 tauri 用内嵌资源（custom protocol）而不是 devUrl。
# `tauri build` 会自动带上它；直接 cargo build 时必须显式 --features custom-protocol，
# 否则二进制会去连 http://localhost:1420（vite dev server），冒烟/发布都会白屏。
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
strip = true
lto = "thin"
# 打包速度优先：codegen-units=1 会把 bin crate 的编译+链接拖到 ~139s/次；
# 16 是 cargo release 默认并行度（exe 约 5.5MB→6.5MB，包内占比 <0.5%，冷启动读入差异可忽略）
codegen-units = 16
panic = "abort"
